name: LLVM Experimental CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/llvm'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version
      - name: Bootstrap compiler (clang)
        run: CC=clang ./bootstrap.sh
      - name: Build specunit
        run: bin/spec --quiet -i utilities/specunit/SpecUnit.spec -o bin/specunit
      - name: Run testllvm suite
        run: bin/specunit -s bin/spec -t testllvm

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check clang
        run: clang --version
      - name: Bootstrap compiler (macOS clang)
        run: CC=clang ./bootstrap.sh
      - name: Build specunit
        run: bin/spec --quiet -i utilities/specunit/SpecUnit.spec -o bin/specunit
      - name: Run testllvm suite
        run: bin/specunit -s bin/spec -t testllvm

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
      - name: Check clang
        run: clang --version
      - name: Bootstrap compiler (MinGW UCRT64)
        run: ./bootstrap.sh
      - name: Build specunit
        run: bin/spec.exe --quiet -i utilities/specunit/SpecUnit.spec -o bin/specunit.exe
      - name: Run testllvm suite
        run: |
          CUR_DRIVE="$(pwd | cut -d/ -f2)"
          mkdir -p "/${CUR_DRIVE}/tmp" /tmp /c/tmp /d/tmp 2>/dev/null || true
          if command -v mount >/dev/null 2>&1; then
            mount -f "/${CUR_DRIVE}/tmp" /tmp 2>/dev/null || true
          fi
          bin/specunit.exe -s bin/spec.exe -t testllvm

name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap compiler (gcc)
        run: ./bootstrap.sh
      - name: Regression suite
        run: |
          bin/spec --quiet -i utilities/specunit/SpecUnit.spec -o bin/specunit
          bin/specunit -s bin/spec -t examples -t tests

  clang:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Bootstrap compiler (clang)
        run: CC=clang ./bootstrap.sh
      - name: Regression suite
        run: |
          bin/spec --quiet -i utilities/specunit/SpecUnit.spec -o bin/specunit
          bin/specunit -s bin/spec -t examples -t tests

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap compiler (macOS clang)
        run: CC=clang ./bootstrap.sh
      - name: Regression suite
        run: |
          bin/spec --quiet -i utilities/specunit/SpecUnit.spec -o bin/specunit
          bin/specunit -s bin/spec -t examples -t tests

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # Newer Ubuntu kernels ship vm.mmap_rnd_bits=32, which crashes gcc's
        # AddressSanitizer at startup; 28 is the known-good value.
      - name: Lower ASLR entropy for ASan compatibility
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build sanitized compiler and run suite
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -fno-omit-frame-pointer bootstrap/spec.c -o bin/spec-asan -pthread -lm
          export ASAN_OPTIONS=detect_leaks=0
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          bin/spec-asan --quiet -i utilities/specunit/SpecUnit.spec -o bin/specunit-asan
          bin/specunit-asan -s bin/spec-asan -t examples -t tests

  release:
    needs: [gcc, clang, macos, sanitizer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.000.100")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG"

      - name: Build Compiler and Tooling Binaries
        run: |
          ./bootstrap.sh
          bin/spec --quiet -i utilities/specunit/SpecUnit.spec -o bin/specunit
          bin/spec --quiet -i utilities/speclint/SpecLint.spec -o bin/speclint

      - name: Package Distribution Artifacts
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p dist
          cp bin/spec dist/spec
          cp bin/specunit dist/specunit
          cp bin/speclint dist/speclint
          TARBALL="spec-${TAG}-linux-x86_64.tar.gz"
          tar -czvf "dist/${TARBALL}" \
            bin/spec bin/specunit bin/speclint \
            spec/ bootstrap/ README.md utilities/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/spec
            dist/specunit
            dist/speclint
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

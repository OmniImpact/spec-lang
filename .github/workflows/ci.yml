name: CI

on:
  workflow_dispatch:

jobs:
  gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap compiler (gcc)
        run: ./bootstrap.sh
      - name: Regression suite
        run: bash utilities/run_tests.sh

  clang:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Bootstrap compiler (clang)
        run: CC=clang ./bootstrap.sh
      - name: Regression suite
        run: bash utilities/run_tests.sh

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # Newer Ubuntu kernels ship vm.mmap_rnd_bits=32, which crashes gcc's
        # AddressSanitizer at startup; 28 is the known-good value.
      - name: Lower ASLR entropy for ASan compatibility
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build sanitized compiler and run suite
        run: bash utilities/run_sanitized.sh

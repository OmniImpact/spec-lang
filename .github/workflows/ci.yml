name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap compiler (gcc)
        run: ./bootstrap.sh
      - name: Build specbuild
        run: bin/spec --quiet -i utilities/specbuild/SpecBuild.spec -o bin/specbuild
      - name: Build tooling
        run: |
          bin/specbuild utilities/specunit/specunit.json
          bin/specbuild utilities/speclint/speclint.json
      - name: Regression suite
        run: |
          bin/specunit -s bin/spec -t tests
      - name: Package Linux Artifact
        run: |
          mkdir -p dist
          zip -9 -j dist/spec-linux-x86_64.zip bin/spec bin/specunit bin/speclint bin/specbuild
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: dist/spec-linux-x86_64.zip
          if-no-files-found: error

  clang:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Bootstrap compiler (clang)
        run: CC=clang ./bootstrap.sh
      - name: Build specbuild
        run: bin/spec --quiet -i utilities/specbuild/SpecBuild.spec -o bin/specbuild
      - name: Build tooling and run regression suite
        run: |
          bin/specbuild utilities/specunit/specunit.json
          bin/specunit -s bin/spec -t tests

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap compiler (macOS clang)
        run: CC=clang ./bootstrap.sh
      - name: Build specbuild
        run: bin/spec --quiet -i utilities/specbuild/SpecBuild.spec -o bin/specbuild
      - name: Build tooling
        run: |
          bin/specbuild utilities/specunit/specunit.json
          bin/specbuild utilities/speclint/speclint.json
      - name: Regression suite
        run: |
          bin/specunit -s bin/spec -t tests
      - name: Package macOS Artifact
        run: |
          ARCH=$(uname -m)
          mkdir -p dist
          zip -9 -j "dist/spec-macos-${ARCH}.zip" bin/spec bin/specunit bin/speclint bin/specbuild
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: dist/spec-macos-*.zip
          if-no-files-found: error

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        # Newer Ubuntu kernels ship vm.mmap_rnd_bits=32, which crashes gcc's
        # AddressSanitizer at startup; 28 is the known-good value.
      - name: Lower ASLR entropy for ASan compatibility
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build sanitized compiler and run suite
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -fno-omit-frame-pointer bootstrap/spec.c -o bin/spec-asan -pthread -lm -ldl
          cp bin/spec-asan bin/spec
          export ASAN_OPTIONS=detect_leaks=0
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          export SPEC_BIN="bin/spec-asan"
          bin/spec-asan --quiet -i utilities/specunit/SpecUnit.spec -o bin/specunit-asan
          bin/specunit-asan -s bin/spec-asan -t tests -j 2

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            zip
      - name: Bootstrap compiler (MinGW UCRT64)
        run: ./bootstrap.sh
      - name: Build specbuild
        run: bin/spec --quiet -i utilities/specbuild/SpecBuild.spec -o bin/specbuild.exe
      - name: Build tooling and run regression suite
        run: |
          CUR_DRIVE="$(pwd | cut -d/ -f2)"
          mkdir -p "/${CUR_DRIVE}/tmp" /tmp /c/tmp /d/tmp 2>/dev/null || true
          if command -v mount >/dev/null 2>&1; then
            mount -f "/${CUR_DRIVE}/tmp" /tmp 2>/dev/null || true
          fi
          export SPEC_BIN="bin/spec.exe"
          bin/specbuild.exe utilities/specunit/specunit.json
          bin/specbuild.exe utilities/speclint/speclint.json
          bin/specunit.exe -s bin/spec.exe -t tests
      - name: Package Windows Artifact
        run: |
          mkdir -p dist
          zip -9 -j dist/spec-windows-x86_64.zip bin/spec.exe bin/specunit.exe bin/speclint.exe bin/specbuild.exe
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist/spec-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs: [gcc, clang, macos, windows, sanitizer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.000.100")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG"

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact
          path: incoming

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-artifact
          path: incoming

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: incoming

      - name: Package Distribution Artifacts
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p dist

          # Rename platform zip files to include the release tag
          for f in incoming/*.zip; do
            [ -f "$f" ] || continue
            filename=$(basename "$f")
            suffix="${filename#spec-}"
            cp "$f" "dist/spec-${TAG}-${suffix}"
          done

      - name: Verify Distribution Artifacts
        run: |
          echo "Distribution artifacts generated:"
          ls -lh dist/
          COUNT=$(ls -1 dist/ | wc -l)
          if [ "$COUNT" -ne 3 ]; then
            echo "Expected exactly 3 artifacts in dist/, found $COUNT!"
            exit 1
          fi
          echo "--- Linux zip contents ---"
          unzip -l dist/spec-*-linux-*.zip
          echo "--- macOS zip contents ---"
          unzip -l dist/spec-*-macos-*.zip
          echo "--- Windows zip contents ---"
          unzip -l dist/spec-*-windows-*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
